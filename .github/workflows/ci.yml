name: Wayangverse CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main, feat/* ]

jobs:
  # 1. Pipeline Frontend Quality Check
  frontend:
    name: Frontend (React 19 & Oxlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fe/package.json

      - name: Install Frontend Dependencies
        working-directory: ./fe
        run: npm install

      - name: Run Linter (Oxlint)
        working-directory: ./fe
        run: npm run lint

      - name: Build Frontend (Production Vite Bundle)
        working-directory: ./fe
        run: npm run build

  # 2. Pipeline Backend Quality Check
  backend:
    name: Backend (Laravel 12 API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        working-directory: ./be
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy Testing Environment
        working-directory: ./be
        run: cp .env.example .env

      - name: Generate App Key
        working-directory: ./be
        run: php artisan key:generate

      - name: Validate Artisan Commands
        working-directory: ./be
        run: php artisan route:list

  # 3. Pipeline Auto-Deploy Backend ke AWS EC2 (Hanya saat Push/Merge ke branch main)
  deploy:
    name: Deploy to AWS EC2
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no ubuntu@$SSH_HOST << 'EOF'
            set -e
            echo "🚀 Menjalankan Auto-Deployment Wayangverse di AWS EC2..."
            cd /home/ubuntu/wayang
            git fetch origin
            git checkout main
            git pull origin main
            sudo docker compose up -d --build backend
            sudo docker compose exec -T backend php artisan migrate --force
            sudo docker compose exec -T backend php artisan config:cache
            sudo docker compose exec -T backend php artisan route:cache
            echo ""
            echo "✅ Auto-deploy sukses! Respon status backend:"
            curl -s http://localhost:8000/api/status
          EOF
