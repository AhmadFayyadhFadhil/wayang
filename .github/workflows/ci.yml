name: Wayangverse CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main, feat/* ]

jobs:
  # 1. Pipeline Frontend Quality Check
  frontend:
    name: Frontend (React 19 & Oxlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fe/package.json

      - name: Install Frontend Dependencies
        working-directory: ./fe
        run: npm install

      - name: Run Linter (Oxlint)
        working-directory: ./fe
        run: npm run lint

      - name: Build Frontend (Production Vite Bundle)
        working-directory: ./fe
        run: npm run build

  # 2. Pipeline Backend Quality Check
  backend:
    name: Backend (Laravel 12 API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        working-directory: ./be
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy Testing Environment
        working-directory: ./be
        run: cp .env.example .env

      - name: Generate App Key
        working-directory: ./be
        run: php artisan key:generate

      - name: Validate Artisan Commands
        working-directory: ./be
        run: php artisan route:list
