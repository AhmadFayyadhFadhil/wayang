<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Prada Gold Gradients -->
    <linearGradient id="wvGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2be" />
      <stop offset="25%" stop-color="#f7d468" />
      <stop offset="65%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7114" />
    </linearGradient>

    <linearGradient id="wvGoldGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e8bb5c" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <!-- Deep Heritage Soga Batik Body -->
    <linearGradient id="wvBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1c0f" />
      <stop offset="50%" stop-color="#1c120a" />
      <stop offset="100%" stop-color="#100a05" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Tab Contrast -->
    <filter id="wvTabShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <g filter="url(#wvTabShadow)">
    <!-- 1. Gagang / Gapit Cempurit Wayang (Handle) -->
    <path
      d="M30 47.5 L29.5 60 C29.5 61.5 34.5 61.5 34.5 60 L34 47.5 Z"
      fill="url(#wvGoldGrad)"
      stroke="#7c5409"
      stroke-width="0.8"
    />

    <!-- 2. Siluet Utama Badan Gunungan / Kayon Wayang Kulit -->
    <path
      d="M32 3.5
         C33.8 8.5 37 12 39 14.5
         C36.5 16 36.2 18 38 20
         C42.5 23.5 47 27 48.5 32
         C45.5 33.5 45.2 35.8 47.5 38
         C50.5 41 51 44 47.5 47.5
         C43.5 50.8 36.5 50.5 32 50.5
         C27.5 50.5 20.5 50.8 16.5 47.5
         C13 44 13.5 41 16.5 38
         C18.8 35.8 18.5 33.5 15.5 32
         C17 27 21.5 23.5 26 20
         C27.8 18 27.5 16 25 14.5
         C27 12 30.2 8.5 32 3.5 Z"
      fill="url(#wvBodyGrad)"
      stroke="url(#wvGoldGrad)"
      stroke-width="2.4"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 3. Batang Utama Pohon Hayat (Mandira Kalpataru) -->
    <line
      x1="32"
      y1="13"
      x2="32"
      y2="47.5"
      stroke="url(#wvGoldGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- 4. Ranting & Dahan Hayat Mengembang (Branches) -->
    <!-- Tingkat Atas -->
    <path
      d="M32 18.5 C36 16.5 39 16.5 41 18"
      fill="none"
      stroke="url(#wvGoldGrad)"
      stroke-width="1.6"
      stroke-linecap="round"
    />
    <path
      d="M32 18.5 C28 16.5 25 16.5 23 18"
      fill="none"
      stroke="url(#wvGoldGrad)"
      stroke-width="1.6"
      stroke-linecap="round"
    />

    <!-- Tingkat Tengah -->
    <path
      d="M32 26 C38 23 43 24 45.5 28"
      fill="none"
      stroke="url(#wvGoldGrad)"
      stroke-width="1.7"
      stroke-linecap="round"
    />
    <path
      d="M32 26 C26 23 21 24 18.5 28"
      fill="none"
      stroke="url(#wvGoldGrad)"
      stroke-width="1.7"
      stroke-linecap="round"
    />

    <!-- Tingkat Bawah -->
    <path
      d="M32 34 C39 32 44.5 34 46.5 39"
      fill="none"
      stroke="url(#wvGoldGrad)"
      stroke-width="1.7"
      stroke-linecap="round"
    />
    <path
      d="M32 34 C25 32 19.5 34 17.5 39"
      fill="none"
      stroke="url(#wvGoldGrad)"
      stroke-width="1.7"
      stroke-linecap="round"
    />

    <!-- 5. Gapura / Lawang Swarga Candi Sasana -->
    <path
      d="M26.5 48 L26.5 40.5 C26.5 37.5 37.5 37.5 37.5 40.5 L37.5 48"
      fill="none"
      stroke="url(#wvGoldGrad)"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line
      x1="24"
      y1="43.5"
      x2="40"
      y2="43.5"
      stroke="url(#wvGoldGrad)"
      stroke-width="1.5"
      stroke-linecap="round"
    />

    <!-- 6. Pucuk Mustika Kencana (Sacred Crown Jewel) -->
    <circle
      cx="32"
      cy="7.5"
      r="2"
      fill="url(#wvGoldGlint)"
      stroke="#b8860b"
      stroke-width="0.8"
    />
  </g>
</svg>